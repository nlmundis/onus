find = "        if name != expected:"
replace = "        if False:"

[[mutant]]
name = "wheel_metadata_version_unchecked"
why = "pip installs by METADATA's Version; a wheel whose METADATA disagrees with the tag installs as another version."
suites = ["tests.test_repo.DistCheckTest"]
