replace = 'elif (said := metadata_version(wheel.read(metadata[0]).decode("utf-8"))) is None:'

[[mutant]]
name = "sdist_pkg_info_version_unchecked"
why = "An install from the sdist builds with PKG-INFO's Version; one that disagrees with the tag ships another version."
suites = ["tests.test_repo.DistCheckTest"]
file = "tools/check_dist.py"
find = 'elif (said := metadata_version(extracted.read().decode("utf-8"))) != version:'
replace = 'elif (said := metadata_version(extracted.read().decode("utf-8"))) is None:'

[[mutant]]
name = "metadata_version_read_from_the_description"
why = "The headers end at the first blank line; reading past it takes a 'Version:' line from the package's description for its version."
suites = ["tests.test_repo.DistCheckTest"]
file = "tools/check_dist.py"
find = """        if not line.strip():
            break
"""
replace = ""

[[mutant]]
name = "package_find_matches_sibling_packages"
why = "onus* also matches a top-level onus_extras/, which ships in the wheel while mypy, coverage, compat, and the stdlib-only checks look only at onus/."
