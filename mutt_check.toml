[[mutant]]
name = "a_wilson_quantile_labelled_with_the_default_confidence"
why = "An interval drawn at z = 1 is about 68%; labelled 95%, every report quoting it overstates its confidence."
suites = ["tests.test_stats.IntervalTest"]
file = "onus/stats/intervals.py"
find = "        level = _checked(k, n, Fraction(implied))"
replace = '        level = _checked(k, n, "0.95")'

[[mutant]]
name = "a_confidence_of_zero_or_one_accepted"
why = "A confidence of 1 has no finite interval and 0 has no interval at all; accepting either returns bounds that mean nothing."
suites = ["tests.test_stats.IntervalTest"]
file = "onus/stats/intervals.py"
find = 'return probability(confidence, "confidence", open_interval=True)'
replace = 'return probability(confidence, "confidence")'

[[mutant]]
name = "a_power_target_of_zero_or_one_accepted"
why = "No test has power 1 short of certainty, and power 0 is met by no effect at all; an MDE for either is meaningless."
suites = ["tests.test_stats.PowerTest"]
file = "onus/stats/power.py"
find = 'target = probability(power, "power", open_interval=True)'
replace = 'target = probability(power, "power")'


[[mutant]]
name = "a_confidence_beside_z_accepted"
why = "Given both, the interval is drawn at z but labelled with the confidence, so the label can be anything the caller typed."
suites = ["tests.test_stats.IntervalTest"]
file = "onus/stats/intervals.py"
find = "        if confidence is not None:\n            raise"
replace = "        if False:\n            raise"

[[mutant]]
name = "clopper_pearson_upper_bound_solved_directly"
why = "Solving P(X >= k + 1) = 1 - tail loses everything to cancellation at high confidence: at 0.99999999999999 the upper bound for 1 of 1000 came out 0.9998 instead of 0.036."
suites = ["tests.test_stats.IntervalTest"]
file = "onus/stats/intervals.py"
find = "high = 1.0 if k == n else 1 - _root(lambda p: _upper(n - k, n, p), tail)"
replace = "high = 1.0 if k == n else _root(lambda p: _upper(k + 1, n, p), 1 - tail)"
