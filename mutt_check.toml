find = 'include = ["onus", "onus.*"]'
replace = 'include = ["onus*"]'

[[mutant]]
name = "wheel_contents_beyond_the_package_unchecked"
why = "A sibling package, a setup.py py_modules entry, or a .data folder would ship in the wheel with no check ever having looked at it."
suites = ["tests.test_repo.DistCheckTest"]
file = "tools/check_dist.py"
find = "        if extra:"
replace = "        if False:"

[[mutant]]
name = "release_builds_into_the_checkout"
why = "The checkout's dist/ is a folder the gate never builds into; a tracked file there breaks the build, and one inside it rides along into the release."
suites = ["tests.test_repo.ReleaseWorkflowTest"]
