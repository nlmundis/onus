[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onus"
dynamic = ["version"]
description = "Claims that carry their own proof: exact pre-registered statistical tests, signed approval baselines, and deterministic property checks for unittest suites."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Mundis" }]
keywords = ["testing", "statistics", "pre-registration", "approval-testing", "property-based-testing", "unittest"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Nothing at runtime: onus ships into environments that may not allow third-party packages.
dependencies = []

[project.optional-dependencies]
# Reserved for onus.invariants, the one subpackage that will import hypothesis; the rest never will.
invariants = ["hypothesis>=6.168.1,<7"]

[tool.setuptools.packages.find]
# The package and its subpackages only: "onus*" would also ship a top-level onus_extras/ no check looks at.
include = ["onus", "onus.*"]

[tool.setuptools.package-data]
onus = ["py.typed"]

# One version, in onus.__version__.
[tool.setuptools.dynamic]
version = { attr = "onus.__version__" }

[tool.black]
line-length = 120
target-version = ["py311"]
# Black's default exclusions, set explicitly: with exclude unset, black also skips whatever any .gitignore at any
# depth lists, so one such file could take a module out of the format stage.
exclude = '/(\.direnv|\.eggs|\.git|\.hg|\.ipynb_checkpoints|\.mypy_cache|\.nox|\.pytest_cache|\.ruff_cache|\.tox|\.svn|\.venv|\.vscode|__pypackages__|_build|buck-out|build|dist|venv)/'

[tool.ruff]
line-length = 120
target-version = "py311"
# ruff otherwise skips whatever a .gitignore, .ignore, or .git/info/exclude lists, at any depth; its own default
# exclusions (.venv, build, dist, the caches) still apply.
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "ANN", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation, and test methods and helpers need no annotations.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["onus", "tests", "tools"]

[[tool.mypy.overrides]]
# Tests are type-checked, but test methods need not be annotated.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["onus", "tools"]

[tool.coverage.report]
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
show_missing = true
skip_covered = true
