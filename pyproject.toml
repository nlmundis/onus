[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onus"
dynamic = ["version"]
description = "Claims that carry their own proof: exact pre-registered statistical tests, signed approval baselines, and deterministic property checks for unittest suites."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Mundis" }]
keywords = ["testing", "statistics", "pre-registration", "approval-testing", "property-based-testing", "unittest"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Nothing at runtime: onus ships into environments that may not allow third-party packages.
dependencies = []

[project.optional-dependencies]
# Only onus.invariants imports hypothesis; every other subpackage works without it.
invariants = ["hypothesis>=6.168.1,<7"]

[tool.setuptools.packages.find]
include = ["onus*"]

[tool.setuptools.package-data]
onus = ["py.typed"]

# One version, in onus.__version__.
[tool.setuptools.dynamic]
version = { attr = "onus.__version__" }

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "ANN", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation and its signature is always (self) -> None;
# same exception as work-graph and jira-rule-migrator.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["onus", "tests"]

[[tool.mypy.overrides]]
# Tests are type-checked, but test methods need not be annotated.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["onus"]

[tool.coverage.report]
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
show_missing = true
skip_covered = true
